<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tango Binary Translator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: #4fc3f7; margin-bottom: 4px; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 24px; font-size: 14px; }
        
        .status-card {
            background: #141414;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            border: 1px solid #222;
            text-align: center;
        }
        .status-text { font-size: 32px; font-weight: 600; margin-bottom: 8px; }
        .status-on { color: #4caf50; }
        .status-off { color: #f44336; }
        .status-desc { color: #888; font-size: 14px; }
        
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }
        .btn-enable { background: #4caf50; color: white; }
        .btn-disable { background: #f44336; color: white; }
        .btn-disabled { opacity: 0.5; cursor: not-allowed; }
        
        .info-card {
            background: #141414;
            border-radius: 16px;
            padding: 20px;
            margin-top: 16px;
            border: 1px solid #222;
        }
        .info-text {
            font-size: 14px;
            line-height: 1.6;
            color: #aaa;
        }
        code {
            background: #1f1f1f;
            padding: 2px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            color: #4fc3f7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tango Binary Translator</h1>
        <p class="subtitle">Run ARM32 binaries on ARM64-only devices</p>

        <div class="status-card">
            <div id="status-text" class="status-text status-off">OFF</div>
            <div class="status-desc">Tap button to toggle</div>
        </div>

        <button id="btn-toggle" class="btn btn-enable" onclick="toggle()">Enable</button>

        <div class="info-card">
            <div class="info-text">
                <p><strong>Status:</strong> <span id="status-detail">Checking...</span></p>
                <p style="margin-top:8px"><strong>Usage:</strong></p>
                <p><code>tango /path/to/arm32-binary</code></p>
                <p style="margin-top:8px; color:#666; font-size:12px;">
                    Enable to load tango32 + ntsync modules and register binfmt_misc.
                    Disable to unload modules. State persists after reboot.
                </p>
            </div>
        </div>
    </div>

    <script type="module">
        import { exec, toast } from 'kernelsu';

        async function runCmd(cmd) {
            try {
                const { errno, stdout } = await exec(cmd);
                return { ok: errno === 0, out: stdout || '' };
            } catch (e) {
                return { ok: false, out: e.message };
            }
        }

        async function refresh() {
            const result = await runCmd('/system/bin/module-toggle status');
            const status = result.out.trim();
            const isEnabled = status === 'enabled' || status.includes('will load');
            
            const btn = document.getElementById('btn-toggle');
            const statusText = document.getElementById('status-text');
            const statusDetail = document.getElementById('status-detail');
            
            if (isEnabled) {
                btn.textContent = 'Disable';
                btn.className = 'btn btn-disable';
                statusText.textContent = 'ON';
                statusText.className = 'status-text status-on';
            } else {
                btn.textContent = 'Enable';
                btn.className = 'btn btn-enable';
                statusText.textContent = 'OFF';
                statusText.className = 'status-text status-off';
            }
            
            statusDetail.textContent = status;
        }

        window.toggle = async function() {
            const btn = document.getElementById('btn-toggle');
            btn.disabled = true;
            
            const action = btn.textContent === 'Enable' ? 'enable' : 'disable';
            const result = await runCmd(`/system/bin/module-toggle ${action}`);
            
            if (result.ok) {
                toast(`${action}d`);
            } else {
                toast(`Failed: ${result.out}`);
            }
            
            btn.disabled = false;
            await refresh();
        };

        // Initial refresh
        setTimeout(refresh, 100);
    </script>
</body>
</html>
